<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <!-- Login/Create User Section -->
        <div id="login-section" class="mb-4">
            <h2>Login or Create User</h2>
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <button id="create-user-btn" class="btn btn-secondary">Create User</button>
            </form>
        </div>

        <!-- Task Section -->
        <div id="task-section" style="display: none;">
            <h2>Tasks</h2>
            <button id="logout-btn" class="btn btn-danger mb-3">Logout</button>
            <form id="task-form" class="mb-4">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" id="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" class="form-control" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="due_date" class="form-label">Due Date</label>
                    <input type="date" id="due_date" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success">Add Task</button>
            </form>

            <ul id="task-list" class="list-group"></ul>
        </div>
    </div>

    <script>
        let loggedInUsername = null;

        // Login form submission
        $('#login-form').on('submit', function (e) {
            e.preventDefault();

            const username = $('#username').val();
            const password = $('#password').val();

            // Check if user exists and login
            $.ajax({
                url: '/users/login',  // Adjusted to a separate login route
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username, password }),
                success: function () {
                    alert('Login successful!');
                    loggedInUsername = username;
                    $('#login-section').hide();
                    $('#task-section').show();
                    fetchTasks();
                },
                error: function (xhr) {
                    alert(xhr.responseJSON.error || 'Login failed.');
                }
            });
        });

        // Create User Button
        $('#create-user-btn').on('click', function (e) {
            e.preventDefault();

            const username = $('#username').val();
            const password = $('#password').val();

            $.ajax({
                url: '/users', // Route to create a new user
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username, password }),
                success: function () {
                    alert('User created successfully! Please log in.');
                },
                error: function (xhr) {
                    alert(xhr.responseJSON.error || 'Failed to create user.');
                }
            });
        });

        // Logout Button
        $('#logout-btn').on('click', function () {
            loggedInUsername = null;
            $('#task-section').hide();
            $('#login-section').show();
        });

        // Fetch tasks
        function fetchTasks() {
            $.ajax({
                url: `/tasks?username=${loggedInUsername}`,
                method: 'GET',
                success: function (tasks) {
                    const taskList = $('#task-list');
                    taskList.empty();

                    tasks.forEach(task => {
                        const taskItem = $(
                            `<li class="list-group-item d-flex justify-content-between align-items-center">
                                ${task.title} (Due: ${task.due_date})
                                <button class="btn btn-danger btn-sm delete-task" data-id="${task.id}">Delete</button>
                            </li>`
                        );
                        taskList.append(taskItem);
                    });
                },
                error: function (xhr) {
                    alert(xhr.responseJSON.error || 'Failed to fetch tasks.');
                }
            });
        }

        // Task form submission
        $('#task-form').on('submit', function (e) {
            e.preventDefault();

            const title = $('#title').val();
            const description = $('#description').val();
            const due_date = $('#due_date').val();

            $.ajax({
                url: '/tasks',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username: loggedInUsername, title, description, due_date }),
                success: function (response) {
                    alert(response.message);
                    fetchTasks();
                },
                error: function (xhr) {
                    alert(xhr.responseJSON.error || 'Task creation failed.');
                }
            });
        });

        // Delete task
        $('#task-list').on('click', '.delete-task', function () {
            const taskId = $(this).data('id');

            $.ajax({
                url: `/tasks/${taskId}`,
                method: 'DELETE',
                success: function (response) {
                    alert(response.message);
                    fetchTasks();
                },
                error: function (xhr) {
                    alert(xhr.responseJSON.error || 'Failed to delete task.');
                }
            });
        });
    </script>
</body>
</html>
